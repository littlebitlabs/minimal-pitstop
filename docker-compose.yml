    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    command:
      - |
        set -eu
        ISSUER=$$(cat /pub/issuer)
        printf '%s' "$$ISSUER" | grep -Eq '^https?://[a-z0-9.-]+(:[0-9]{1,5})?$$' || { echo "studio: the identity provider origin in /pub/issuer is missing or has an unexpected shape - not starting" >&2; exit 1; }
        cat > /tmp/Caddyfile <<EOF
        {
        	admin off
        	auto_https off
        }
        :80 {
        	root * /srv
        	encode zstd gzip
        	header {
        		X-Content-Type-Options nosniff
        		Referrer-Policy no-referrer
        		Content-Security-Policy "frame-ancestors 'none'; connect-src 'self' $$ISSUER"
        	}
        	handle /studio/* {
        		try_files {path} {path}/index.html /studio/index.html
        		file_server {
        			hide .*
        		}
        	}
        	respond 404
        }
        EOF
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
