# docker-compose.standalone.yml — GENERATED by scripts/render-standalone-compose.sh (#105). DO NOT EDIT.
# Start here: https://artifacts.littlebitlabs.com/api/packages/littlebitlabs/generic/docs/0.3.6/minimal-getting-started.md
# Pitstop (the Minimal Core stack) as one file: no repo checkout, no builds. Beside it:
#   ./licence/licence.json   your licence (never part of an image)
#   ./pitstop.yaml           optional inputs; absent = all defaults (sample: compose/pitstop.yaml.sample in the repo)
#   LICENSE_SECRET           in the environment:  LICENSE_SECRET=... docker compose up -d
# Prefer a form to a text file? `docker compose up wizard` (from this folder) serves the guided installer; it asks
# for the same inputs, starts the stack and narrates the boot. It holds the Docker socket: see the guide before you use it.
# Every image is pinned by digest: Littlebit's as <tag>@digest from the release, the upstream ones as
# <tag>@digest as recorded in the digests file (see its header for the date they were resolved).
# Needs Docker Engine >= 26 and Docker Compose >= 2.17.
configs:
  ops-backup:
    content: |
      #!/bin/sh
      # pitstop backup (#149) — runs inside the `backup` service (the stack's own postgres image, so pg_dump matches the servers).
      #
      #   docker compose run --rm -T backup > pitstop-backup.tar     ONE tar: the 3 databases + the 4 volumes (secrets, certificates, tokens)
      #   docker compose run --rm -T backup keys                     ONLY the two keys nothing can recreate, as text (see below)
      #
      # The archive holds EVERY secret of the installation (database passwords, the Zitadel master key, the Core encryption key, the licence
      # secret): treat it like a password vault — create it private (`umask 077` first), encrypt it before it leaves the machine (gpg, age).
      # The checksums inside it catch damage, not tampering: the file's authenticity is yours to protect (sign or encrypt it).
      # `keys` is for a database copy taken some other way (a provider snapshot of the Postgres volumes): without these two keys such a copy
      # cannot be read. Keep them OFFLINE and apart from the archive.
      #
      # Online: the stack keeps running. Each database is dumped consistently on its own (pg_dump); the three are dumped one after the other,
      # so for a backup consistent ACROSS them stop the writers first (`docker compose stop minimal zitadel`, then `start` them again).
      # Needs free disk of about the size of the compressed dumps (they are staged in the container before the tar is streamed out).
      # The licence file, pitstop.yaml and .env live beside docker-compose.yml, not in a volume: keep them yourself.
      set -eu
      umask 077
      SRC=/backup-src
      die() { echo "backup: $$*" >&2; exit 1; }
      # the five secrets a database dump is worthless without — fingerprinted so a restore can tell it is loading into the SAME installation
      fp() { cat "$$1/zitadel/zitadel_masterkey" "$$1/core/encryption_key" "$$1/pg-zitadel/pg_zitadel_super" "$$1/pg-core/pg_core_super" "$$1/pg-app/pg_app_super" | sha256sum | cut -d' ' -f1; }
      [ -e "$$SRC/state/.ready" ] || die "nothing to back up: the state volume has no finished installation"
      case "$${1:-all}" in
        all) ;;
        keys)
          echo "# Pitstop recovery keys, $$(date -u +%Y-%m-%dT%H:%M:%SZ). Keep OFFLINE (a password manager, a printout). Without BOTH, a database copy is unreadable."
          printf 'ZITADEL_MASTERKEY=%s\n' "$$(cat "$$SRC/state/zitadel/zitadel_masterkey")"
          printf 'CORE_ENCRYPTION_KEY=%s\n' "$$(cat "$$SRC/state/core/encryption_key")"
          exit 0;;
        *) die "usage: backup [keys]   (no argument = the whole backup to stdout)";;
      esac
      [ -t 1 ] && die "refusing to write a tar archive to the terminal: redirect it (docker compose run --rm -T backup > pitstop-backup.tar)"
      WORK=$$(mktemp -d); trap 'rm -rf "$$WORK"' EXIT
      mkdir -p "$$WORK/pg" "$$WORK/volumes"
      export PGCONNECT_TIMEOUT=10
      dump() { # name host superuser database password-file
        PGPASSWORD=$$(cat "$$SRC/state/$$5") timeout 3600 pg_dump -h "$$2" -U "$$3" -d "$$4" -Fc -f "$$WORK/pg/$$1.dump" || die "pg_dump of $$1 failed (is $$2 running and healthy?)"
        PGPASSWORD=$$(cat "$$SRC/state/$$5") timeout 120 pg_dumpall -h "$$2" -U "$$3" --globals-only -f "$$WORK/pg/$$1.globals.sql" || die "pg_dumpall (roles) of $$1 failed"
        echo "backup: database $$1 dumped ($$(du -h "$$WORK/pg/$$1.dump" | cut -f1))" >&2
      }
      dump zitadel pg-zitadel postgres zitadel pg-zitadel/pg_zitadel_super
      dump core    pg-core    postgres minimal pg-core/pg_core_super
      dump app     pg-app     acme_app acme    pg-app/pg_app_super
      for v in state caddy-data pat-login pat-provisioner; do
        timeout 600 tar -C "$$SRC/$$v" -cf "$$WORK/volumes/$$v.tar" . || die "archiving the $$v volume failed"
        echo "backup: volume $$v archived" >&2
      done
      {
        echo "format=pitstop-backup/1"
        echo "created=$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "tools=$$(pg_dump --version)"
        echo "secrets_sha256=$$(fp "$$SRC/state")"
      } > "$$WORK/MANIFEST"
      (cd "$$WORK" && find MANIFEST pg volumes -type f | sort | xargs sha256sum > SHA256SUMS)
      tar -C "$$WORK" -cf - MANIFEST SHA256SUMS pg volumes
      echo "backup: done. The archive holds every secret of this installation: keep it private and encrypt it." >&2
  ops-restore:
    content: |
      #!/bin/sh
      # pitstop restore (#149) — runs inside the `restore-state` / `restore-data` services. Onto a FRESH host: the same docker-compose.yml,
      # ./licence/licence.json and pitstop.yaml (and .env) as the original, nothing started yet. Three commands:
      #
      #   docker compose run --rm -T restore-state < pitstop-backup.tar     1. the volumes: secrets, certificates, tokens (nothing else starts)
      #   docker compose run --rm -T restore-data  < pitstop-backup.tar     2. the databases (starts only the three Postgres servers)
      #   docker compose up -d --wait                                       3. everything else
      #
      # Step 1 must come before anything starts — `setup` would otherwise generate NEW secrets the restored databases cannot open — and it
      # refuses a host that already holds an installation. Step 2 also works in place on the SAME installation (put an older state back):
      # it refuses an archive made by another installation (the secrets differ) and refuses while any service still uses the databases.
      # Both steps check the archive's shape and checksums before they change anything. The checksums catch damage, not tampering.
      set -eu
      umask 077
      DST=/restore-dst
      die() { echo "restore: $$*" >&2; exit 1; }
      fp() { cat "$$1/zitadel/zitadel_masterkey" "$$1/core/encryption_key" "$$1/pg-zitadel/pg_zitadel_super" "$$1/pg-core/pg_core_super" "$$1/pg-app/pg_app_super" | sha256sum | cut -d' ' -f1; }
      STEP="$${1:-}"; case "$$STEP" in state|data) ;; *) die "internal: the step is state or data";; esac
      [ -t 0 ] && die "feed the archive on stdin: docker compose run --rm -T restore-$$STEP < pitstop-backup.tar"
      WORK=$$(mktemp -d); trap 'rm -rf "$$WORK"' EXIT

      # ---- the archive: exactly our shape (no links, no stray paths), then its checksums, BEFORE anything is extracted or changed ----------
      cat > "$$WORK/in.tar"
      tar -tf "$$WORK/in.tar" > "$$WORK/names" 2>/dev/null || die "that is not a tar archive"
      if grep -Evx 'MANIFEST|SHA256SUMS|pg/?|pg/(zitadel|core|app)\.(dump|globals\.sql)|volumes/?|volumes/(state|caddy-data|pat-login|pat-provisioner)\.tar' "$$WORK/names" >/dev/null; then
        die "not a Pitstop backup: it holds entries a backup never has"; fi
      if tar -tvf "$$WORK/in.tar" | cut -c1 | grep -q '[^-d]'; then die "not a Pitstop backup: it holds links or special files"; fi
      mkdir "$$WORK/x"; tar -C "$$WORK/x" -xf "$$WORK/in.tar" || die "the archive could not be read"
      rm -f "$$WORK/in.tar"
      for f in MANIFEST SHA256SUMS; do [ -s "$$WORK/x/$$f" ] || die "not a Pitstop backup: $$f is missing"; done
      F=$$(sed -n 's/^format=//p' "$$WORK/x/MANIFEST")
      [ "$$F" = "pitstop-backup/1" ] || die "unknown backup format '$$F' (this restore reads pitstop-backup/1)"
      (cd "$$WORK/x" && sha256sum -c SHA256SUMS >/dev/null 2>&1) || die "the archive is damaged: a checksum does not match — nothing was changed"
      echo "restore: archive verified (made $$(sed -n 's/^created=//p' "$$WORK/x/MANIFEST"))" >&2

      if [ "$$STEP" = state ]; then
        [ ! -e "$$DST/state/.ready" ] || die "this host already holds a Pitstop installation: restore state only onto a FRESH one (\`docker compose down -v\` removes everything, irrecoverably)"
        for v in state caddy-data pat-login pat-provisioner; do   # all four are checked before the first is written
          [ -d "$$DST/$$v" ] || die "the $$v volume is not mounted"
          T="$$WORK/x/volumes/$$v.tar"
          if tar -tvf "$$T" | cut -c1 | grep -q '[^-d]'; then die "volume $$v holds links or special files"; fi
          if tar -tf "$$T" | grep -Eq '(^|/)\.\.(/|$$)|^/'; then die "volume $$v holds paths that leave it"; fi
        done
        for v in state caddy-data pat-login pat-provisioner; do
          timeout 600 tar -C "$$DST/$$v" -xf "$$WORK/x/volumes/$$v.tar" || die "restoring the $$v volume failed"
          echo "restore: volume $$v restored" >&2
        done
        echo "restore: next: docker compose run --rm -T restore-data < <the same archive>" >&2
        exit 0
      fi

      # ---- data: the same installation, nothing using the databases, roles first (existing ones are fine), then each database -----------
      [ -e "$$DST/state/.ready" ] || die "run restore-state first (the secrets must be in place before the databases are loaded)"
      [ "$$(sed -n 's/^secrets_sha256=//p' "$$WORK/x/MANIFEST")" = "$$(fp "$$DST/state")" ] \
        || die "this archive was made by a DIFFERENT installation (its secrets are not the ones in this state volume): restore-state onto a fresh host first"
      export PGCONNECT_TIMEOUT=10
      restore_db() { # name host superuser database password-file
        export PGPASSWORD; PGPASSWORD=$$(cat "$$DST/state/$$5")
        busy=$$(psql -h "$$2" -U "$$3" -d postgres -tA -c "select count(*) from pg_stat_activity where datname = '$$4' and backend_type = 'client backend'") || die "cannot reach $$2"
        [ "$$busy" = 0 ] || die "$$busy session(s) still use the $$1 database: stop the other services first (\`docker compose down\` keeps the data; this step starts the databases itself)"
        timeout 120 psql -h "$$2" -U "$$3" -d postgres -q -f "$$WORK/x/pg/$$1.globals.sql" >/dev/null 2>&1 || true   # roles that exist already are fine; their passwords are set to the archive's
        # drop and recreate rather than pg_restore --clean: --clean cannot drop inherited constraints of partitioned tables in a non-empty database
        timeout 120 psql -h "$$2" -U "$$3" -d postgres -q -v ON_ERROR_STOP=1 -c "drop database if exists \"$$4\" with (force)" -c "create database \"$$4\"" || die "recreating the $$4 database failed"
        timeout 3600 pg_restore -h "$$2" -U "$$3" -d "$$4" --exit-on-error "$$WORK/x/pg/$$1.dump" \
          || die "loading the $$1 database failed (the server's first error is above). It may be partly loaded: wipe the host (\`docker compose down -v\`) and start again from restore-state"
        echo "restore: database $$1 restored" >&2
      }
      restore_db zitadel pg-zitadel postgres zitadel pg-zitadel/pg_zitadel_super
      restore_db core    pg-core    postgres minimal pg-core/pg_core_super
      restore_db app     pg-app     acme_app acme    pg-app/pg_app_super
      echo "restore: next: docker compose up -d --wait" >&2
